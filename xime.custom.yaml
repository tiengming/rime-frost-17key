metadata:
  app_name: Xime
  app_version: ">=2.6.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator"
  modified_time: "2026-08-15"

xime_index:
  base_urls:
    - "https://cdn.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://fastly.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://index.ximei.me/"
    - "https://raw.githubusercontent.com/ximeiorg/xime-index/refs/heads/main/"

style:
  color_scheme:
    light: cyber_lumina
    dark: midnight_iris
  dark_mode: 2

color_schemes:
  # ── 1. Cyber Lumina (极光数字蓝 - 水滴毛玻璃版) ──
  cyber_lumina:
    name: "Cyber Lumina (Glass)"
    primary_color: 0x6366F1
    keyboard_background:
      type: gradient
      colors: [0xE6EEF2FF, 0xB3F8FAFC]
      colors_dark: [0xE60F172A, 0xB31E293B]
      angle: 135
      blur_radius: 24

  # ── 2. Moss Sanctuary (苔原微光 - 水滴毛玻璃版) ──
  moss_sanctuary:
    name: "Moss Sanctuary (Glass)"
    primary_color: 0x3B7A57
    keyboard_background:
      type: gradient
      colors: [0xE6EDF5F0, 0xB3F6FAF7]
      colors_dark: [0xE6121F17, 0xB31C2E23]
      angle: 135
      blur_radius: 24

  # ── 3. Terracotta Dusk (陶土晚霞 - 水滴毛玻璃版) ──
  terracotta_dusk:
    name: "Terracotta Dusk (Glass)"
    primary_color: 0xBF5B43
    keyboard_background:
      type: gradient
      colors: [0xE6FAF0EC, 0xB3FFF5F0]
      colors_dark: [0xE6241612, 0xB333201B]
      angle: 135
      blur_radius: 24

  # ── 4. Glacial Mint (冰川凉苔 - 水滴毛玻璃版) ──
  glacial_mint:
    name: "Glacial Mint (Glass)"
    primary_color: 0x0D9488
    keyboard_background:
      type: gradient
      colors: [0xE6E6F4F1, 0xB3F2FAF8]
      colors_dark: [0xE6102220, 0xB319302D]
      angle: 135
      blur_radius: 24

  # ── 5. Solar Amber (琥珀日光 - 水滴毛玻璃版) ──
  solar_amber:
    name: "Solar Amber (Glass)"
    primary_color: 0xD97706
    keyboard_background:
      type: gradient
      colors: [0xE6FFFBEB, 0xB3FFFAF0]
      colors_dark: [0xE6241C10, 0xB3332818]
      angle: 135
      blur_radius: 24

  # ── 6. Midnight Iris (深夜鸢尾 - 水滴毛玻璃版) ──
  midnight_iris:
    name: "Midnight Iris (Glass)"
    primary_color: 0x8B5CF6
    keyboard_background:
      type: gradient
      colors: [0xE6F3E8FF, 0xB3FAF5FF]
      colors_dark: [0xE61C1329, 0xB3271B38]
      angle: 135
      blur_radius: 24

keyboard:
  colors:
    # 全局中性玻璃底座：高透明度透光基底
    keyboard_bg_color: 0xCCF8FAFC
    keyboard_bg_color_dark: 0xCC0F172A

    # 悬浮玻璃按键：浅色 75% 不透明高光白，深色 20% 高光白
    key_bg_color: 0xBFFFFFFF
    key_bg_color_dark: 0x33FFFFFF

    # 候选词栏：轻薄水滴光晕
    candidate_bar_bg_color: 0xB3F8FAFC
    candidate_bar_bg_color_dark: 0xB30F172A

    # 兼容性中性文字色：高对比度 Slate 灰阶，保证在 6 套方案的毛玻璃上都不撞色且符合 WCAG AA 可读标准
    key_text_color: 0x0F172A
    key_text_color_dark: 0xF8FAFC
    candidate_text_color: 0x0F172A
    candidate_text_color_dark: 0xF8FAFC

  key:
    corner_radius: 8

  shadow:
    enabled: true
    elevation: 2

  qwerty:
    layout:
      rows:
        - [[q, w], [e, r], [t, y], u, i, [o, p]]
        - [[a, s], [d, f], g, h, [j, k], l]
        - [[z, x], c, v, [b, n], m]
    button_layout: compact
    keys:
      # swipe_up 数字/符号按行序排布：上排 1-0、中排符号、下排符号
      qw: { tap: { label: "qw", value: "q" }, swipe_up: "1", swipe_down: { label: "iu\nei", action: "none", display: "key" }, long_press: { display: "bubble", values: ["q", "Q", "w", "W"] } }
      er: { tap: { label: "er", value: "e" }, swipe_up: "2", swipe_down: { label: "e\nuan", action: "none", display: "key" }, long_press: { display: "bubble", values: ["e", "E", "r", "R"] } }
      ty: { tap: { label: "ty", value: "t" }, swipe_up: "3", swipe_down: { label: "ue\nve\nun", action: "none", display: "key" }, long_press: { display: "bubble", values: ["t", "T", "y", "Y"] } }
      u:  { tap: { label: "u", value: "u" }, swipe_up: "4", swipe_down: { label: "sh\nu", action: "none", display: "key" }, long_press: { display: "bubble", values: ["u", "U"] } }
      i:  { tap: { label: "i", value: "i" }, swipe_up: "5", swipe_down: { label: "ch\ni", action: "none", display: "key" }, long_press: { display: "bubble", values: ["i", "I"] } }
      op: { tap: { label: "op", value: "o" }, swipe_up: "6", swipe_down: { label: "o\nuo\nie", action: "none", display: "key" }, long_press: { display: "bubble", values: ["o", "O", "p", "P"] } }
      as: { tap: { label: "as", value: "a" }, swipe_up: "7", swipe_down: { label: "a\niong\nong", action: "none", display: "key" }, long_press: { display: "bubble", values: ["a", "A", "s", "S"] } }
      df: { tap: { label: "df", value: "d" }, swipe_up: "8", swipe_down: { label: "ai\nen", action: "none", display: "key" }, long_press: { display: "bubble", values: ["d", "D", "f", "F"] } }
      g:  { tap: { label: "g", value: "g" }, swipe_up: "9", swipe_down: { label: "eng", action: "none", display: "key" }, long_press: { display: "bubble", values: ["g", "G"] } }
      h:  { tap: { label: "h", value: "h" }, swipe_up: "0", swipe_down: { label: "ang", action: "none", display: "key" }, long_press: { display: "bubble", values: ["h", "H"] } }
      jk: { tap: { label: "jk", value: "j" }, swipe_up: { label: "-", value: "-" }, swipe_down: { label: "an\ning\nuai", action: "none", display: "key" }, long_press: { display: "bubble", values: ["j", "J", "k", "K"] } }
      l:  { tap: { label: "l", value: "l" }, swipe_up: { label: "*", value: "*" }, swipe_down: { label: "iang\nuang", action: "none", display: "key" }, long_press: { display: "bubble", values: ["l", "L"] } }
      zx: { tap: { label: "zx", value: "z" }, swipe_up: { label: ")", value: ")" }, swipe_down: { label: "ou\nia\nua", action: "none", display: "key" }, long_press: { display: "bubble", values: ["z", "Z", "x", "X"] } }
      c:  { tap: { label: "c", value: "c" }, swipe_up: { label: "@", value: "@" }, swipe_down: { label: "ao", action: "none", display: "key" }, long_press: { display: "bubble", values: ["c", "C"] } }
      v:  { tap: { label: "v", value: "v" }, swipe_up: { label: "?", value: "?" }, swipe_down: { label: "zh\nui\nv", action: "none", display: "key" }, long_press: { display: "bubble", values: ["v", "V"] } }
      bn: { tap: { label: "bn", value: "b" }, swipe_up: { label: "!", value: "!" }, swipe_down: { label: "in\niao", action: "none", display: "key" }, long_press: { display: "bubble", values: ["b", "B", "n", "N"] } }
      m:  { tap: { label: "m", value: "m" }, swipe_up: { label: "#", value: "#" }, swipe_down: { label: "ian", action: "none", display: "key" }, long_press: { display: "bubble", values: ["m", "M"] } }
      "'": { tap: { label: "，", value: "," }, swipe_up: { label: "。", value: "." }, long_press: { display: "bubble", values: [",", "."] } }
      earth: { 
        tap: { label: "@language", action: "toggle_ascii" }, 
        long_press: { display: "bubble", values: [{ label: "选择输入法", action: "command", value: "show_ime_picker" }] } 
      }

  qwerty_en:
    button_layout: standard
    keys:
      q: { tap: "q", swipe_up: "1", swipe_down: { label: "!", action: "commit", value: "!", display: "key" }, long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "2", swipe_down: { label: "@", action: "commit", value: "@", display: "key" }, long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "3", swipe_down: { label: "#", action: "commit", value: "#", display: "key" }, long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: "r", swipe_up: "4", swipe_down: { label: "$", action: "commit", value: "$", display: "key" }, long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "5", swipe_down: { label: "%", action: "commit", value: "%", display: "key" }, long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "6", swipe_down: { label: "^", action: "commit", value: "^", display: "key" }, long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: "u", swipe_up: "7", swipe_down: { label: "&", action: "commit", value: "&", display: "key" }, long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: "i", swipe_up: "8", swipe_down: { label: "*", action: "commit", value: "*", display: "key" }, long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: "o", swipe_up: "9", swipe_down: { label: "(", action: "commit", value: "(", display: "key" }, long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: "p", swipe_up: "0", swipe_down: { label: ")", action: "commit", value: ")", display: "key" }, long_press: { display: "bubble", values: ["p", "P"] } }

      a: { tap: "a", swipe_up: "~", swipe_down: { label: "全选", action: "select_all", display: "key" }, long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: "s", swipe_up: "/", swipe_down: { label: "清空", action: "command", value: "clear_composition", display: "key" }, long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: ":", swipe_down: { label: "重试", action: "repeat", display: "key" }, long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: ";", swipe_down: { label: ";", action: "commit", value: ";", display: "key" }, long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "\"", swipe_down: { label: "\"", action: "commit", value: "\"", display: "key" }, long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "'", swipe_down: { label: "'", action: "commit", value: "'", display: "key" }, long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "-", swipe_down: { label: "-", action: "commit", value: "-", display: "key" }, long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "(", swipe_down: { label: "[", action: "commit", value: "[", display: "key" }, long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: ")", swipe_down: { label: "]", action: "commit", value: "]", display: "key" }, long_press: { display: "bubble", values: ["l", "L"] } }

      z: { tap: "z", swipe_up: "[", swipe_down: { label: "撤销", action: "undo", display: "key" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: "]", swipe_down: { label: "剪切", action: "cut", display: "key" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "{", swipe_down: { label: "复制", action: "copy", display: "key" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { tap: "v", swipe_up: "}", swipe_down: { label: "粘贴", action: "paste", display: "key" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: "_", swipe_down: { label: "换行", action: "commit", value: "\n", display: "key" }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: "<", swipe_down: { label: "段首", action: "line_start", display: "key" }, long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { tap: "m", swipe_up: ">", swipe_down: { label: "段尾", action: "line_end", display: "key" }, long_press: { display: "bubble", values: ["m", "M"] } }
      "'": { tap: { label: ",", value: "," }, swipe_up: { label: ".", value: "." } }
      earth: { tap: { label: "@language", action: "toggle_ascii" } }
